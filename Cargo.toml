[package]
name = "aoc2015"
version = "0.0.1"
edition = "2021"

[dependencies]
argh = "0.1"
colored = "3.1.1"
serde = { version = "1.0", features = ["derive"] }
paste = "1.0"
serde_yaml = "0.9"
itertools = "0.15.0"
z3 = "0.20.0"
md-5 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
criterion = "0.8.2"

# The "debug" profile
[profile.release]
panic = "abort"
debug = true
lto = "thin"

# The profile to benchmark with (`cargo run --profile benchmark`)
[profile.benchmark]
inherits = "release"
debug = false
lto = "fat"

[profile.bench]
inherits = "release"
debug = false
lto = "fat"

[[bench]]
name = "bench"
harness = false
